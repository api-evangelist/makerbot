summary:
  types: [oauth2, http]
  api_key_in: []
  oauth2_flows: [authorizationCode, implicit]
  notes: >-
    The MakerBot Thingiverse REST API requires a Bearer access token on every
    request. Unauthenticated requests return HTTP 401 with
    {"error","code":401,"type":"NO_TOKEN_PROVIDED"}. The WWW-Authenticate
    response header is "Bearer V1". Tokens are obtained either as per-application
    App Tokens issued when registering an app, or via the OAuth 2.0
    authorization flow for acting on behalf of a Thingiverse user.
schemes:
