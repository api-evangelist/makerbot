    type: http
    scheme: bearer
    bearerFormat: opaque
    location: header
    header: Authorization
    evidence: 'WWW-Authenticate: Bearer V1 header returned by api.thingiverse.com'
    sources: [live probe https://api.thingiverse.com/things/1]
  - name: OAuth2
    type: oauth2
    flows:
      - flow: authorizationCode
        authorizationUrl: https://www.thingiverse.com/login/oauth/authorize
        tokenUrl: https://www.thingiverse.com/login/oauth/token
        note: >-
          authorizationUrl verified live (302 -> /login when unauthenticated);
          tokenUrl per Thingiverse developer docs.
      - flow: implicit
        authorizationUrl: https://www.thingiverse.com/login/oauth/authorize
