aid: makerbot
name: Makerbot
description: >-
  MakerBot is a desktop 3D printer manufacturer, now part of UltiMaker, and the
  operator of Thingiverse, the largest online community for discovering, sharing,
  and downloading 3D-printable designs. MakerBot's public developer surface is the
  Thingiverse REST API (https://api.thingiverse.com), a Bearer-token / OAuth 2.0
  authenticated JSON API that exposes things (models), their files and images,
  users, collections, categories, tags, and full-text search. Developers register
  an application on the Thingiverse developers site to receive an App Token or run
  the OAuth 2.0 authorization flow to act on behalf of a Thingiverse user. This
  profile was surfaced as a venture-backed company and enriched from its live API.
