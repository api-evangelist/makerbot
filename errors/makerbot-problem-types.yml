    a human-readable message, a numeric HTTP code, and a machine-readable type
    string. It does NOT use RFC 9457 application/problem+json.
  content_type: application/json
  fields:
    error: Human-readable error message
    code: Numeric HTTP status code
    type: Machine-readable error identifier (e.g. NO_TOKEN_PROVIDED)
